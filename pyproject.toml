[project]
name = "ai-infrastructure-audit-tool"
version = "0.1.0"
description = "A prototype audit tool for Linux and Windows infrastructure"
requires-python = ">=3.9"
dependencies = [
    "paramiko>=2.11.0",
    "pywinrm>=0.4.2",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["audit_tool*", "web*"]
