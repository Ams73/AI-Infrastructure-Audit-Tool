[project]
name = "ai-infrastructure-audit-tool"
version = "0.1.0"
description = "A prototype audit tool for Linux and Windows infrastructure"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["audit_tool*", "web*"]
