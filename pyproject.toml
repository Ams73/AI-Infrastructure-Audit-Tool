[project]
name = "ai-infrastructure-audit-tool"
version = "0.2.0.dev0"
description = "Security and operational audit checks for Linux and Windows servers, with an optional AI summary"
requires-python = ">=3.9"
dependencies = [
    "paramiko>=2.11.0",
    "pywinrm>=0.4.2",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    # Needed for the login/audit form; newer FastAPI releases no longer install it.
    "python-multipart>=0.0.9",
]
ai = [
    # Python 3.9 resolves to the 0.x SDK line; 1.x requires Python 3.10+.
    "anthropic>=0.125",
]
dev = [
    # FastAPI's TestClient needs httpx; anthropic 1.x no longer pulls it in.
    "httpx",
    "build",
]

[project.scripts]
infra-audit = "audit_tool.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
# Only the audit_tool package is installed. web/ is a source-checkout shim.
include = ["audit_tool*"]
